# Tests automáticos en cada push y cada PR (los 480+ tests corren sin Docker en segundos).
# El corrector oficial y `evaluacion/verificar_entrega2.py` quedan afuera: necesitan la planta
# simulada levantada y 4 CPU (ver README, "Cómo correr los tests").
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Los dos repos uno al lado del otro, como en la PC de desarrollo: algunos tests leen casos
      # reales de `academia2026-tp/datos/...` (cierres_ejemplo.json) y se saltean si no está.
      - name: Checkout josbert-rizzo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: josbert-rizzo

      - name: Checkout academia2026-tp (planta de la cátedra, solo datos)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NovitSoftware/academia2026-tp
          path: academia2026-tp

      # Misma versión que la imagen del agente (`src/Dockerfile`: python:3.11-slim).
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: josbert-rizzo/pyproject.toml

      - name: Instalar dependencias
        working-directory: josbert-rizzo
        run: pip install -e ".[dev]"

      - name: Tests
        working-directory: josbert-rizzo
        run: pytest -q

      # Informativo: hoy hay avisos de estilo pendientes y no conviene tocar tantos archivos
      # antes de la entrega. Se ven en el log, pero no frenan la CI.
      - name: Lint (informativo)
        working-directory: josbert-rizzo
        continue-on-error: true
        run: ruff check src tests --statistics
