[project]
name = "josbert-rizzo-tp-academia"
version = "0.1.0"
description = "Sistema de mantenimiento asistido para la planta de inyección PIA-3 (TP Academia Novit 2026, Entrega 1)"
requires-python = ">=3.11"
dependencies = [
    "planta_contrato @ git+https://github.com/NovitSoftware/academia2026-planta#subdirectory=contrato",
    "langchain>=0.3",
    "paho-mqtt>=2.1",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
