# Sistema de mantenimiento — TP Academia Novit 2026 (Entrega 1)
#
# Requiere la planta corriendo al lado (ver ../academia2026-tp):
#   cd ../academia2026-tp && docker compose up -d --build
#
#   docker compose up -d --build
#
# Central de mantenimiento: http://localhost:8200

name: josbert-rizzo

services:
  agente:
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        TRANSCRIPCION_MODELO_LOCAL: ${TRANSCRIPCION_MODELO_LOCAL:-small}
    env_file: [.env]
    environment:
      MQTT_HOST: broker
      HISTORIAN_URL: http://sim:8100
      POSTGRES_HOST: postgres
      OLLAMA_URL: http://ollama:11434
      HTTP_PROXY: http://enlace:3128
      HTTPS_PROXY: http://enlace:3128
      NO_PROXY: broker,sim,localhost,postgres,ollama
      # hf-xet (el backend de transferencia nuevo de huggingface_hub) no respeta bien
      # HTTP_PROXY/HTTPS_PROXY acá adentro y se cuelga bajando el modelo de Whisper sin avisar
      # ni dar error (ver BUGS.md). Con esto, huggingface_hub vuelve a bajar por HTTP común.
      HF_HUB_DISABLE_XET: "1"
      # Lote 6 (A1/A7): hilos acordes a la CPU de cada contenedor. Por defecto Whisper y Ollama
      # usan un hilo por núcleo del host (4) aunque el contenedor tenga 2.5 y 1.5 CPU, y el cgroup
      # los frena a la fuerza (throttling) justo cuando la máquina está cargada.
      WHISPER_HILOS: "2"
      OLLAMA_HILOS: "2"
    labels:
      academia.planta: pc
    # Lote 6 (B9): con un init de verdad como PID 1, `docker stop` (SIGTERM) le llega al agente,
    # que cierra MQTT limpio; antes Python era PID 1, ignoraba la señal y lo mataban a los 10 s.
    init: true
    # Informativo (`docker ps` lo muestra unhealthy): el latido escribe este archivo en cada vuelta.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/agente-vivo')<60 else 1)\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
    volumes:
      - notas-media:/data/notas
      - whisper-modelos:/root/.cache/huggingface
    networks: [planta-lan, backend]
    depends_on:
      postgres: {condition: service_healthy}
      ollama: {condition: service_started}
    deploy:
      resources:
        # Entre agente y ollama: 4 CPU / 8 GB, el límite de la PC de planta (docs/contrato.md).
        # El agente se lleva más CPU porque Whisper es lo que decide si una nota se contesta a tiempo.
        limits: {cpus: "2.5", memory: 2g}
    restart: unless-stopped

  ollama:
    # Los modelos se bajan en el BUILD de esta imagen (ver ollama/Dockerfile), no en el arranque
    # del contenedor: el corrector borra los volúmenes entre escenarios (`down -v`), y bajar
    # qwen2.5:1.5b (986 MB) en el arranque tardó más de 1 minuto en una corrida real — casi todo
    # el tiempo real que dura un escenario. Horneado en la imagen, el modelo está listo al toque.
    build:
      context: ./ollama
      args:
        LLM_MODELO_EXTRACCION: ${LLM_MODELO_EXTRACCION:-qwen2.5:1.5b}
        RAG_MODELO_EMBEDDINGS: ${RAG_MODELO_EMBEDDINGS:-nomic-embed-text}
    environment:
      HTTP_PROXY: http://enlace:3128
      HTTPS_PROXY: http://enlace:3128
      NO_PROXY: broker,sim,localhost,postgres,agente,127.0.0.1
      # Lote 6 (A4): los modelos quedan cargados (se vio una recarga de 6.6 s en medio de una
      # nota) y se atiende un pedido a la vez: con 1.5 CPU, dos pedidos en paralelo solo se
      # reparten la misma CPU y reservan 4 contextos de memoria. La sugerencia del LLM (baja
      # prioridad) se corta cuando llega una nota (`llm/ollama.py`), así que no la hace esperar.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    labels:
      academia.planta: pc
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    volumes:
      - ollama-modelos:/root/.ollama
    networks: [planta-lan]
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 6g}
    restart: unless-stopped

  central:
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        TRANSCRIPCION_MODELO_LOCAL: ${TRANSCRIPCION_MODELO_LOCAL:-small}
    command: ["uvicorn", "sistema.interfaces.central:app", "--host", "0.0.0.0", "--port", "8200"]
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
    ports: ["${CENTRAL_PUERTO:-8200}:8200"]
    init: true
    volumes:
      - notas-media:/data/notas:ro
    # `publica` solo para exponer el puerto 8200 a las personas (una red `internal` no publica
    # puertos); con Postgres habla por `backend`.
    networks: [backend, publica]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema}
      POSTGRES_USER: ${POSTGRES_USER:-sistema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sistema}
    volumes:
      - sistema-db:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sistema}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  # Red de la planta: ya existe, la crea academia2026-tp. No se recrea acá.
  planta-lan:
    external: true
  # Red propia, para el agente, la central y postgres. Lote 6 (B10): `internal`, sin salida a
  # internet. Antes no lo era, y el agente (que corre en la PC de planta) tenía una salida directa
  # que saltaba el enlace: el contrato dice que la planta sale solo por `enlace:3128`.
  backend:
    internal: true
  # Solo para publicar el puerto de la central.
  publica:

volumes:
  sistema-db:
  notas-media:
  ollama-modelos:
  whisper-modelos:
